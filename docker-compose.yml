# ============================================================
# Vocero CRM — Ruta B: app + Postgres + Caddy (HTTPS automático)
# Uso:        pnpm init-env --domain tu.dominio  →  pnpm doctor  →  docker compose up -d
#             (sin Node: cp .env.example .env y rellenar a mano)
# Actualizar: git pull  →  docker compose up -d
#
# La app sale de la imagen publicada de la versión (una por tag vX.Y.Z). Con
# `image` y `build` juntos y sin `pull_policy`, Compose intenta primero
# descargar la imagen y solo la construye desde este repo si no la encuentra
# ni en el registro ni en tu máquina (especificación de Compose, «Using build
# and image»: docs.docker.com/reference/compose-file/build/):
#
#   docker compose up -d           la imagen publicada
#   docker compose up -d --build   construida desde el código (la publicada
#                                  es linux/amd64: en un VPS ARM, construye)
#
# Lo que construyes queda en tu máquina con este mismo nombre de imagen. En un
# fork con cambios propios usa siempre --build (o cambia `image:` por un
# nombre tuyo): sin él, Compose puede correr la imagen oficial en vez de tus
# cambios. Otra versión publicada: VOCERO_CRM_VERSION=X.Y.Z en tu .env.
#
# 2.0 — El agente (Nea) es un servicio al lado del CRM, sobre la MISMA base
# en su esquema `nea`. El CRM le despacha cada ráfaga y Nea contesta por
# /api/bot/*. Mientras se publica la imagen de Nea 2.0.0 va detrás del
# perfil `nea`:
#
#   docker compose --profile nea up -d
#
# con BOT_API_KEY, BRAIN_DISPATCH_URL=http://nea:8000/vocero/dispatch y la
# llave de IA en el .env. Guía: docs/migrar-a-2.0.md.
# ============================================================
services:
  app:
    image: ghcr.io/kevinrivm/vocero-crm:${VOCERO_CRM_VERSION:-1.6.0}
    build: .
    restart: unless-stopped
    environment:
      APP_BASE_URL: ${APP_BASE_URL}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/vocero
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_GRAPH_API_VERSION: ${META_GRAPH_API_VERSION:-v25.0}
      OPENROUTER_API_TOKEN: ${OPENROUTER_API_TOKEN:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      OPENROUTER_JUDGE_MODEL: ${OPENROUTER_JUDGE_MODEL:-}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-}
      AGENT_COALESCE_MS: ${AGENT_COALESCE_MS:-6000}
      # Opcionales: vacías = apagadas (guía de cada una en .env.example).
      CHANNELS: ${CHANNELS:-}
      AGENDA: ${AGENDA:-}
      ATRIBUCION: ${ATRIBUCION:-}
      BOT_API_KEY: ${BOT_API_KEY:-}
      BRAIN_HEALTH_URL: ${BRAIN_HEALTH_URL:-}
      # 035 — A dónde despachar: con el perfil `nea`, http://nea:8000/vocero/dispatch.
      BRAIN_DISPATCH_URL: ${BRAIN_DISPATCH_URL:-}
    volumes:
      # Adjuntos, logo e icono (la imagen ya trae MEDIA_DIR=/data/media): sin
      # este volumen se pierden al recrear el contenedor.
      - vocero_app_data:/data
    depends_on:
      postgres:
        condition: service_healthy
    # el HEALTHCHECK vive en el Dockerfile (/api/health)

  # 035 — El agente. Misma base que el CRM, en su esquema `nea`: el par no
  # pide una segunda base. La llave del despacho es BOT_API_KEY, la misma
  # con la que Nea le contesta al CRM. Sin dominio público: el CRM le habla
  # por la red interna.
  nea:
    image: ghcr.io/kevinrivm/nea-agent:${NEA_VERSION:-2.0.0}
    profiles: ["nea"]
    restart: unless-stopped
    environment:
      CRM_BASE_URL: http://app:3000
      CRM_BOT_API_KEY: ${BOT_API_KEY:-}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/vocero
      DATABASE_SCHEMA: nea
      # 036 — Sin LLM_API_KEY: Nea piensa por el CRM (/api/bot/llm) con la
      # llave de Ajustes → IA y el modelo que elegiste ahí. Este es solo el
      # de respaldo, si el CRM todavía no tiene modelo.
      LLM_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4o-mini}
      # Mientras pruebas: tu número. Vacía = Nea le contesta a todos.
      ALLOWED_WA_IDS: ${ALLOWED_WA_IDS:-}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: vocero
    volumes:
      - vocero_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vocero"]
      interval: 10s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - vocero_caddy_data:/data
      - vocero_caddy_config:/config
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  vocero_pg:
  vocero_app_data:
  vocero_caddy_data:
  vocero_caddy_config:
